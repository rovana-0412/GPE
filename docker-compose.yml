x-laravel-environment: &laravel-environment
  APP_KEY: "${APP_KEY:?Définir APP_KEY dans le fichier .env}"
  JWT_SECRET: "${JWT_SECRET:?Définir JWT_SECRET dans le fichier .env}"
  SESSION_DRIVER: file
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  LOG_CHANNEL: stderr

x-database-environment: &database-environment
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: "${DB_USERNAME:-gpe_user}"
  DB_PASSWORD: "${DB_PASSWORD:?Définir DB_PASSWORD dans le fichier .env}"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: "${DB_USERNAME:-gpe_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Définir DB_PASSWORD dans le fichier .env}"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: [*laravel-environment, *database-environment]
      DB_DATABASE: gpe_auth
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  patrimoine-service:
    build:
      context: ./services/patrimoine-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: [*laravel-environment, *database-environment]
      DB_DATABASE: gpe_patrimoine
      MOUVEMENTS_URL: http://mouvements-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mouvements-service:
    build:
      context: ./services/mouvements-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: [*laravel-environment, *database-environment]
      DB_DATABASE: gpe_mouvements
      PATRIMOINE_URL: http://patrimoine-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mouvements_documents:/var/www/html/storage/app/private
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *laravel-environment
      AUTH_URL: http://auth-service:8000
      PATRIMOINE_URL: http://patrimoine-service:8000
      MOUVEMENTS_URL: http://mouvements-service:8000
    depends_on:
      auth-service:
        condition: service_healthy
      patrimoine-service:
        condition: service_healthy
      mouvements-service:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      patrimoine-service:
        condition: service_healthy
      mouvements-service:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  mouvements_documents:
