services:
  postgres:
    image: postgres:16
    container_name: gpe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpe_db
      POSTGRES_USER: gpe_user
      POSTGRES_PASSWORD: gpe_password_dev
    ports:
      # Port hote 5433 : le service PostgreSQL natif de Windows occupe le 5432.
      # Adapter DB_PORT dans application/.env en consequence.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
