events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:9000;
    }

    upstream patrimoine_service {
        server patrimoine-service:9001;
    }

    upstream mouvements_service {
        server mouvements-service:9002;
    }

    upstream web {
        server web:9003;
    }

    server {
        listen 80;
        server_name localhost;

        # Routing vers auth-service
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routing vers patrimoine-service
        location /api/patrimoine/ {
            proxy_pass http://patrimoine_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routing vers mouvements-service
        location /api/mouvements/ {
            proxy_pass http://mouvements_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routing vers web (tout le reste)
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
